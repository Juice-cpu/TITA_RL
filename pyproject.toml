[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tita-uc-residual-rl"
version = "0.1.0"
description = "Core safety and objective prototype for TITA residual RL"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
